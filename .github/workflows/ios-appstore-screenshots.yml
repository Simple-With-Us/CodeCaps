name: iOS App Store Screenshots

# Captures the App Store screenshots for the CodeCaps iOS companion.
#
# There is no iOS simulator runtime on Jay's Mac, so the captures have to come
# from a runner.  The script builds the companion for one iPhone and one iPad
# simulator, seeds each with a realistic quota snapshot and writes one PNG per
# screen at the exact pixel size App Store Connect accepts, asserting the size
# before the file is handed on.
#
# The app needs seconds to draw its first frame, so the script polls the screen
# and keeps the first frame that holds more than the status bar.  A fixed
# sleep captured a blank window, and a blank window is a picture of nothing.
#
# The upload to App Store Connect is deliberately NOT done here.  It is a
# separate, explicit step run from a machine with the App Store Connect key:
#
#   node scripts/ios-fleet/asc-api.mjs upload-screenshots \
#     <localizationId> auto app_iphone_67-fleet-status.png
#   node scripts/ios-fleet/asc-api.mjs upload-screenshots \
#     <localizationId> auto app_ipad_pro_129-fleet-status.png
#
# so a re-run of this workflow can never quietly add duplicate screenshots to
# a live version.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ios/CodeCapsCompanion/**"
      # The exact shared files the companion compiles, and not the whole of
      # Sources/QuotaCore: most QuotaCore edits are Mac-only, and a capture
      # that shows more than the shipped build would be worse than a stale
      # one.  This list mirrors ios-ship.yml, so the screenshots and the
      # TestFlight build change together.
      - "Sources/QuotaCore/CompanionReadTokenStore.swift"
      - "Sources/QuotaCore/FleetSourceDisagreement.swift"
      - "Sources/QuotaCore/QuotaWindowVocabulary.swift"
      - "Sources/QuotaCore/ResetAlarmCadence.swift"
      - "Sources/QuotaCore/ResetAlarmMessage.swift"
      - "Sources/QuotaCore/ResetAlarmTracker.swift"
      - "Sources/QuotaCore/WidgetPlatformDisplay.swift"
      - "Sources/QuotaCore/WidgetSnapshotFetcher.swift"
      # The helpers the capture calls.  A change to either of them changes
      # what the capture keeps, so it has to bring a new capture with it.
      - "scripts/ios-fleet/capture-appstore-screenshots.sh"
      - "scripts/ios-fleet/pick_simulator.py"
      - "scripts/ios-fleet/screenshot_ink.py"
      - ".github/workflows/ios-appstore-screenshots.yml"

concurrency:
  group: ios-appstore-screenshots-${{ github.ref }}
  # Only supersede a run for the same pull request.  Cancelling on a push to
  # main would report cancelled checks for a commit that nothing replaced.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  screenshots:
    name: Capture iPhone and iPad screenshots
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi

      - name: Capture App Store screenshots
        run: |
          chmod +x scripts/ios-fleet/capture-appstore-screenshots.sh
          scripts/ios-fleet/capture-appstore-screenshots.sh "$RUNNER_TEMP/appstore-screenshots"

      - name: Report the captured sizes
        run: |
          for shot in "$RUNNER_TEMP"/appstore-screenshots/*; do
            echo "::group::$(basename "$shot")"
            sips -g pixelWidth -g pixelHeight -g hasAlpha "$shot" | grep -E "pixel|/sips" || true
            echo "::endgroup::"
          done

      - name: Upload the captured screenshots
        uses: actions/upload-artifact@v7
        with:
          name: appstore-screenshots
          path: ${{ runner.temp }}/appstore-screenshots/*
          if-no-files-found: error
