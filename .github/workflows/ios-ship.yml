name: iOS TestFlight ship (GitHub-hosted macOS)

# AUTO-SHIP CONTRACT (owner 2026-10-17): a merge to main that touches the iOS
# native tree uploads a fresh TestFlight build with no human step and publishes
# What to Test (IOS_TF_RELEASE_NOTES=1).  "The native tree" is
# ios/CodeCapsCompanion/** PLUS the shared Sources/QuotaCore files the app and
# widget targets compile (project.yml `../../Sources/QuotaCore/...`).  Both
# lists below (push paths and the scheduled gate's prefixes) are pinned to
# project.yml by scripts/ios-ship-workflow.test.mjs, so a file added to the
# iOS targets cannot quietly stop shipping.  workflow_dispatch is the manual
# path.  The rate gate and the same-HEAD skip are the ship script's defaults:
# never set IOS_TF_MIN_INTERVAL_SEC or --force-ship in this file.
#
# Archive + upload on GitHub-hosted macos-latest (a stable Xcode on a GM macOS,
# never the owned Mac, which runs a beta that App Store review rejects as
# INVALID_BINARY).
#
# Credentials:
#   * App Store Connect key (ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8) comes from
#     Fleet-OPS Infisical prod /asc, the fleet's single copy (owner ruling
#     2026-10-17: usable by any app), exactly as Congress.Trade and
#     Usage-Monitor read it.  The same-named repository secrets are a stale
#     copy that App Store Connect answers with HTTP 401 (CC-163), so they are
#     deliberately not read here and there is no fallback to them.
#   * The multiline key never enters GITHUB_ENV: scripts/ios-stage-asc-key.sh
#     writes it to a mode-600 file and only the path crosses steps.
#   * IOS_DIST_P12_BASE64 / IOS_DIST_P12_PASSWORD (Apple Distribution identity)
#     stay repository secrets.
#   * SENTRY_DSN and SENTRY_AUTH_TOKEN are best-effort: an inert Sentry beats a
#     red TestFlight ship.  Infisical prod first, same-named GitHub secrets as
#     fallback.
#   Values are never printed.
#
# scripts/ios-appstore-gm-prepare.sh imports the Distribution identity (the job
# environment carries ASC_KEY_ID, ASC_ISSUER_ID and ASC_KEY_PATH to the ship step).  IOS_MANUAL_SIGN=1 signs Release with the
# installed App Store profiles.  Xcode's provisioning service rejects this API
# key, so the job must not ask it to create or update profiles.
#
# Marketing train is 1.0.N (AGENT-SYNC: 0.x.x is banned); build is UTC
# YYYYMMDDHHMM.  Bundle `com.simplewithus.codecaps.ios`, team `CC8UTF7ATG`.
#
# WHY THERE IS A `schedule:` TRIGGER
# A PR merged by github-actions[bot] (auto-merge armed with GITHUB_TOKEN) lands
# on main under GitHub's recursion guard and dispatches NO push run.  The cron
# is exempt from that guard, so it notices what the push never announced.  It
# is gated twice: scripts/ios-fleet/scheduled-ship-gate.sh refuses unless one
# of the iOS paths changed since the last successful ship, and the ship script
# rate-limits and skips an already-shipped HEAD.  push and workflow_dispatch
# bypass the path gate (a push already passed the paths: filter).
#
# The ship state (~/.cache/ios-fleet) is restored from actions/cache because a
# hosted runner starts with an empty home.  The key family is
# `ios-fleet-state-codecaps-ios-`: the old `ios-fleet-state-codecaps-` prefix
# also matched the Mac ship's `...-codecaps-mac-` caches, and its build-seq
# file carried the retired 0.1.N sequence into the 1.0.N train.

on:
  push:
    branches: [main]
    paths:
      - 'ios/CodeCapsCompanion/**'
      # Shared sources the iOS app and widget targets compile.  Exact files, not
      # Sources/QuotaCore/**: most QuotaCore edits are Mac-only and must not
      # ship a TestFlight build.
      - 'Sources/QuotaCore/CompanionReadTokenStore.swift'
      - 'Sources/QuotaCore/FleetSourceDisagreement.swift'
      - 'Sources/QuotaCore/QuotaWindowVocabulary.swift'
      - 'Sources/QuotaCore/ResetAlarmCadence.swift'
      - 'Sources/QuotaCore/ResetAlarmMessage.swift'
      - 'Sources/QuotaCore/ResetAlarmTracker.swift'
      - 'Sources/QuotaCore/WidgetPlatformDisplay.swift'
      - 'Sources/QuotaCore/WidgetSnapshotFetcher.swift'
      - '.github/workflows/ios-ship.yml'
      - '.github/actions/infisical-secrets/**'
      - 'scripts/infisical-fetch.mjs'
      - 'scripts/ios-fleet/**'
      - '!scripts/ios-fleet/test-*.sh'
      - 'scripts/ios-ship-testflight.sh'
      - 'scripts/ios-appstore-gm-prepare.sh'
      - 'scripts/ios-install-appstore-profiles.sh'
      - 'scripts/ios-stage-asc-key.sh'
  workflow_dispatch:
  schedule:
    # Twice an hour, offset from other fleet apps
    - cron: '26,56 * * * *'

permissions:
  contents: read
  checks: read

concurrency:
  group: ios-ship-codecaps
  cancel-in-progress: false

jobs:
  # The scheduled tick used to queue macos-latest just to decide "skip".
  # That decision, and the wait for Swift CI, both run on ubuntu.  The Mac
  # runner starts only when this commit should ship and has compiled.
  gate:
    name: Ship gate
    if: github.event.repository.fork == false
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      should_ship: ${{ steps.gate.outputs.should_ship }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The gate diffs HEAD against the sha recorded by the last successful
          # ship, which can be many commits back.
          fetch-depth: 0

      - name: Restore ship-state cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ios-fleet
          key: ios-fleet-state-codecaps-ios-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ios-fleet-state-codecaps-ios-${{ github.run_id }}-
            ios-fleet-state-codecaps-ios-

      # Prefixes mirror on.push.paths (minus workflow and script files, which
      # only a push or dispatch should act on).
      - name: Scheduled ship gate (skip unless iOS code changed)
        id: gate
        run: |
          bash "$GITHUB_WORKSPACE/scripts/ios-fleet/scheduled-ship-gate.sh" \
            --event "${{ github.event_name }}" \
            --path-prefix 'ios/CodeCapsCompanion/' \
            --path-prefix 'Sources/QuotaCore/CompanionReadTokenStore.swift' \
            --path-prefix 'Sources/QuotaCore/FleetSourceDisagreement.swift' \
            --path-prefix 'Sources/QuotaCore/QuotaWindowVocabulary.swift' \
            --path-prefix 'Sources/QuotaCore/ResetAlarmCadence.swift' \
            --path-prefix 'Sources/QuotaCore/ResetAlarmMessage.swift' \
            --path-prefix 'Sources/QuotaCore/ResetAlarmTracker.swift' \
            --path-prefix 'Sources/QuotaCore/WidgetPlatformDisplay.swift' \
            --path-prefix 'Sources/QuotaCore/WidgetSnapshotFetcher.swift' \
            --repo-root "$GITHUB_WORKSPACE" \
            codecaps

      - name: Wait for Swift CI compile checks on this commit
        if: steps.gate.outputs.should_ship == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: bash scripts/await-swift-ci-checks.sh

  ship:
    name: TestFlight archive + upload
    needs: gate
    if: >-
      github.event.repository.fork == false &&
      needs.gate.result == 'success' &&
      needs.gate.outputs.should_ship == '1'
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The release notes need the commit range since the last ship.
          fetch-depth: 0

      - name: Restore ship-state cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ios-fleet
          key: ios-fleet-state-codecaps-ios-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ios-fleet-state-codecaps-ios-${{ github.run_id }}-
            ios-fleet-state-codecaps-ios-

      - name: Assert stable Xcode (never beta)
        run: |
          echo "DEVELOPER_DIR=${DEVELOPER_DIR}"
          xcodebuild -version
          ver=$(xcodebuild -version | awk 'NR==1{print $2}')
          echo "Xcode version: ${ver}"
          case "$DEVELOPER_DIR" in
            *[Bb]eta*)
              echo "::error::DEVELOPER_DIR resolves to a beta Xcode: $DEVELOPER_DIR"
              exit 1
              ;;
          esac

      - name: Install xcodegen
        run: |
          if command -v xcodegen >/dev/null 2>&1; then
            xcodegen --version
          else
            brew install xcodegen
          fi

      - name: Load Sentry ship secrets (Infisical, then repository secrets)
        uses: ./.github/actions/infisical-secrets
        with:
          names: SENTRY_DSN SENTRY_AUTH_TOKEN
          project-id: ${{ secrets.INFISICAL_PROJECT_ID }}
          client-id: ${{ secrets.INFISICAL_UNIVERSAL_AUTH_CLIENT_ID || secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET || secrets.INFISICAL_CLIENT_SECRET }}
        env:
          GH_FALLBACK_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          GH_FALLBACK_SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

      # Do not use `secrets.*` in `if:` -- GitHub's dispatch parser rejects it
      # (`Unrecognized named-value: secrets`) and the whole workflow dies at 0s.

      # ASC key from Fleet-OPS prod /asc.  ASC_KEY_ID and ASC_ISSUER_ID are
      # single-line and go to GITHUB_ENV; the multiline private key is staged
      # to a mode-600 file and only ASC_KEY_PATH is exported.
      - name: Load ASC credentials (Fleet-OPS prod /asc)
        env:
          ASC_INFISICAL_PROJECT_ID: 8dae6d03-8f12-48b2-adf3-e5c1b881c8c5
          INFISICAL_UNIVERSAL_AUTH_CLIENT_ID: ${{ secrets.INFISICAL_UNIVERSAL_AUTH_CLIENT_ID }}
          INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET: ${{ secrets.INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET }}
          INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID }}
          INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
        run: |
          set +o xtrace
          set -euo pipefail
          export INFISICAL_DISABLE_UPDATE_CHECK=true

          if ! command -v infisical >/dev/null 2>&1; then
            NONINTERACTIVE=1 HOMEBREW_NO_AUTO_UPDATE=1 brew install infisical/get-cli/infisical
          fi
          command -v infisical >/dev/null 2>&1 || {
            echo "::error::Infisical CLI is not installed."
            exit 1
          }

          CLIENT_ID="${INFISICAL_UNIVERSAL_AUTH_CLIENT_ID}"
          CLIENT_SECRET="${INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET}"
          if [ -z "$CLIENT_ID" ] || [ -z "$CLIENT_SECRET" ]; then
            CLIENT_ID="${INFISICAL_CLIENT_ID}"
            CLIENT_SECRET="${INFISICAL_CLIENT_SECRET}"
          fi
          if [ -z "$CLIENT_ID" ] || [ -z "$CLIENT_SECRET" ]; then
            echo "::error::Missing Infisical machine identity.  Set INFISICAL_UNIVERSAL_AUTH_CLIENT_ID/SECRET (fallback INFISICAL_CLIENT_ID/SECRET) on the org or repo."
            exit 1
          fi

          TOKEN="$(
            env -u INFISICAL_CLIENT_ID -u INFISICAL_CLIENT_SECRET -u INFISICAL_TOKEN \
              INFISICAL_UNIVERSAL_AUTH_CLIENT_ID="$CLIENT_ID" \
              INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET="$CLIENT_SECRET" \
              infisical login --method=universal-auth --silent --plain --telemetry=false 2>/dev/null || true
          )"
          if [ -z "$TOKEN" ]; then
            echo "::error::Infisical universal-auth login failed."
            exit 1
          fi
          if [[ "$TOKEN" == *$'\n'* || "$TOKEN" == *$'\r'* ]]; then
            echo '::error::Infisical returned a multiline token.' >&2
            exit 1
          fi
          printf '::add-mask::%s\n' "${TOKEN//'%'/'%25'}"

          for name in ASC_KEY_ID ASC_ISSUER_ID; do
            val="$(
              INFISICAL_TOKEN="$TOKEN" infisical secrets get "$name" \
                --plain --silent --telemetry=false --expand=false \
                --projectId="$ASC_INFISICAL_PROJECT_ID" --env=prod --path=/asc \
                2>/dev/null || true
            )"
            if [ -z "$val" ]; then
              echo "::error::Missing $name in Fleet-OPS prod /asc; verify the CI identity has read access to project ${ASC_INFISICAL_PROJECT_ID} path /asc." >&2
              exit 1
            fi
            if [[ "$val" == *$'\n'* || "$val" == *$'\r'* ]]; then
              echo "::error::Signing field $name must be single-line; correct Infisical formatting." >&2
              exit 1
            fi
            printf '::add-mask::%s\n' "${val//'%'/'%25'}"
            printf '%s=%s\n' "$name" "$val" >> "$GITHUB_ENV"
          done

          # Keep the multiline PEM out of GITHUB_ENV and every later step
          # environment.  Only its mode-600 file path crosses the step boundary.
          key_material="$(
            INFISICAL_TOKEN="$TOKEN" infisical secrets get ASC_KEY_P8 \
              --plain --silent --telemetry=false --expand=false \
              --projectId="$ASC_INFISICAL_PROJECT_ID" --env=prod --path=/asc \
              2>/dev/null || true
          )"
          if [ -z "$key_material" ]; then
            echo "::error::Missing ASC key material in Fleet-OPS prod /asc; verify the CI identity has read access to project ${ASC_INFISICAL_PROJECT_ID} path /asc." >&2
            exit 1
          fi
          printf '%s\n' "$key_material" | bash "$GITHUB_WORKSPACE/scripts/ios-stage-asc-key.sh"
          unset key_material TOKEN CLIENT_ID CLIENT_SECRET val

      - name: Import signing identity
        env:
          IOS_DIST_P12_BASE64: ${{ secrets.IOS_DIST_P12_BASE64 }}
          IOS_DIST_P12_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
        run: |
          if [ -z "${ASC_KEY_ID:-}" ] || [ -z "${ASC_KEY_PATH:-}" ]; then
            echo "::error::ASC credentials were not loaded from Fleet-OPS prod /asc."
            exit 1
          fi
          if [ -z "${IOS_DIST_P12_BASE64:-}" ]; then
            echo "::error::IOS_DIST_P12_BASE64 is empty.  Confirm the IOS_DIST_ repository secrets are configured."
            exit 1
          fi
          bash "$GITHUB_WORKSPACE/scripts/ios-appstore-gm-prepare.sh"

      - name: Install App Store profiles
        run: bash "$GITHUB_WORKSPACE/scripts/ios-install-appstore-profiles.sh"

      - name: Ship CodeCaps to TestFlight
        env:
          IOS_TF_RELEASE_NOTES: "1"
          IOS_MANUAL_SIGN: "1"
        run: bash scripts/ios-ship-testflight.sh

      - name: Save ship-state cache
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ios-fleet
          key: ios-fleet-state-codecaps-ios-${{ github.run_id }}-${{ github.run_attempt }}
