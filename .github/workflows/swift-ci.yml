name: Swift CI

# Hosted macOS compile gate for CodeCaps (CC-19).  Validates the SwiftPM Mac
# package at the repo root and the iOS companion Xcode project.  Job names
# below are the GitHub status contexts Jay should require on ruleset 24433457;
# see docs/rollouts/2026-10-15-cc19-compile-gate.md.
#
# The companion SCHEME is a best guess: the checked-in CodeCapsCompanion.xcodeproj
# has no shared schemes (no xcshareddata/xcschemes), so verify the scheme name
# on first run.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # A pull request keeps one group, so a new push cancels the run it
  # replaces.  Everything else gets one group per commit and per event:  a
  # single shared group made every later merge cancel the compile run that
  # the release gate was waiting on, because GitHub cancels a run that is
  # still PENDING when a new run joins its group.  One group per commit
  # means a merge never cancels another merge's compile run.  The event is
  # in the group as well, so two runs at the same commit that were started
  # by different events do not cancel one another.
  group: swift-ci-${{ github.event_name == 'pull_request' && github.ref || format('{0}-{1}-{2}', github.event_name, github.ref, github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # REVIEW: adjust if the companion project's scheme is named differently.
  SCHEME: CodeCapsCompanion

jobs:
  package:
    name: Mac package build and test
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Swift build
        run: swift build
      - name: Swift test and render native UI fixtures
        env:
          CODECAPS_DOCS_RENDER_DIR: ${{ runner.temp }}/codecaps-native-ui
        run: swift test
      - name: Assert settings-sources-fleet render is not console-light
        run: |
          dir="${{ runner.temp }}/codecaps-native-ui"
          test -s "$dir/settings-sources-fleet.png"
          test -s "$dir/console-light.png"
          if cmp -s "$dir/settings-sources-fleet.png" "$dir/console-light.png"; then
            echo "::error::settings-sources-fleet.png still matches console-light.png; reconcile Sources & Fleet before render"
            exit 1
          fi
      - name: Upload native UI screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: codecaps-native-ui
          path: ${{ runner.temp }}/codecaps-native-ui/*.png
          if-no-files-found: warn

  companion:
    name: iOS companion compile
    needs: package
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      # The drift check below compares generated files byte for byte, so CI
      # installs the exact XcodeGen that produced the tracked project instead
      # of whatever Homebrew ships this week (a Homebrew bump would otherwise
      # turn this required check red on every PR).  To move to a newer
      # XcodeGen, bump both values (the digest is the xcodegen.zip sha256 shown
      # on that release's GitHub page), run `xcodegen generate` with that
      # version and commit the result.
      XCODEGEN_VERSION: "2.46.0"
      XCODEGEN_SHA256: "4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806"
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned XcodeGen
        run: |
          archive="$RUNNER_TEMP/xcodegen-${XCODEGEN_VERSION}.zip"
          curl -fsSL --retry 3 -o "$archive" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          echo "${XCODEGEN_SHA256}  ${archive}" | shasum -a 256 -c -
          unzip -q "$archive" -d "$RUNNER_TEMP/xcodegen-dist"
          echo "$RUNNER_TEMP/xcodegen-dist/xcodegen/bin" >> "$GITHUB_PATH"
      - name: Regenerate companion project
        run: |
          actual="$(xcodegen --version | awk '{print $NF}')"
          if [ "$actual" != "$XCODEGEN_VERSION" ]; then
            echo "::error title=Wrong XcodeGen version::Expected $XCODEGEN_VERSION but the PATH resolves $actual."
            exit 1
          fi
          cd ios/CodeCapsCompanion
          xcodegen generate
      # The tracked Xcode project, its shared schemes and the generated
      # entitlement plists are all outputs of project.yml.  Anyone who opens
      # the tracked project without regenerating it (Xcode, a local
      # xcodebuild, the TestFlight fallback that reuses the checked-in copy)
      # gets whatever was last committed, so a project.yml change that does not
      # carry its regenerated output leaves a project that no longer compiles.
      # Run before any build step so a stale project fails fast.
      - name: Check the tracked Xcode project matches project.yml
        run: |
          if [ -n "$(git status --porcelain -- ios/CodeCapsCompanion)" ]; then
            echo "::error title=Companion Xcode project is stale::The tracked files under ios/CodeCapsCompanion do not match what XcodeGen ${XCODEGEN_VERSION} generates from project.yml.  Fix:  cd ios/CodeCapsCompanion && xcodegen generate (XcodeGen ${XCODEGEN_VERSION}), then commit the changed files."
            git status --porcelain -- ios/CodeCapsCompanion
            git --no-pager diff --stat -- ios/CodeCapsCompanion
            exit 1
          fi
          echo "The tracked companion Xcode project matches project.yml (XcodeGen ${XCODEGEN_VERSION})."
      - name: List schemes (debug)
        run: |
          cd ios/CodeCapsCompanion
          xcodebuild -list -project CodeCapsCompanion.xcodeproj
      - name: Select an available iPhone simulator
        run: |
          device_id="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; data=json.load(sys.stdin); devices=[d for group in data["devices"].values() for d in group if d.get("isAvailable") and d.get("deviceTypeIdentifier", "").startswith("com.apple.CoreSimulator.SimDeviceType.iPhone")]; print(devices[0]["udid"] if devices else "")')"
          if [ -z "$device_id" ]; then
            echo "::error::No available iPhone simulator is installed on this runner."
            exit 1
          fi
          echo "SIMULATOR_ID=$device_id" >> "$GITHUB_ENV"
      - name: Build and launch companion on iOS Simulator
        run: |
          derived_data="$RUNNER_TEMP/codecaps-companion-derived"
          screenshot="$RUNNER_TEMP/codecaps-ios-reorder.png"
          xcrun simctl boot "$SIMULATOR_ID" 2>/dev/null || true
          xcrun simctl bootstatus "$SIMULATOR_ID" -b
          cd ios/CodeCapsCompanion
          xcodebuild -project CodeCapsCompanion.xcodeproj \
            -scheme "$SCHEME" \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath "$derived_data" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" \
            build
          app="$derived_data/Build/Products/Debug-iphonesimulator/CodeCapsCompanion.app"
          test -d "$app"
          bundle_id=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist")
          xcrun simctl install "$SIMULATOR_ID" "$app"
          app_data="$(xcrun simctl get_app_container "$SIMULATOR_ID" "$bundle_id" data)"
          mkdir -p "$app_data/Library/Application Support/CodeCaps"
          python3 - "$app_data/Library/Application Support/CodeCaps/quota-windows.json" <<'PY'
          import datetime, json, sys
          observed = datetime.datetime.now(datetime.timezone.utc).isoformat(timespec="seconds").replace("+00:00", "Z")
          windows = [
              {"id": "claude-5h", "provider": "anthropic", "providerKey": "anthropic", "label": "5-hour window", "remainingPercent": 72.0, "isExhausted": False, "occurredAt": observed},
              {"id": "codex-weekly", "provider": "openai", "providerKey": "codex", "label": "Weekly", "remainingPercent": 44.0, "isExhausted": False, "occurredAt": observed},
              {"id": "cursor-fast", "provider": "cursor", "providerKey": "cursor", "label": "Fast Requests", "remainingPercent": 28.0, "isExhausted": False, "occurredAt": observed},
          ]
          with open(sys.argv[1], "w", encoding="utf-8") as snapshot:
              json.dump({"windows": windows}, snapshot)
          PY
          xcrun simctl launch --terminate-running-process "$SIMULATOR_ID" "$bundle_id" -openSettings -reorderPlatforms
          sleep 3
          xcrun simctl io "$SIMULATOR_ID" screenshot "$screenshot"
          test -s "$screenshot"
          settings_shot="$RUNNER_TEMP/codecaps-ios-settings.png"
          xcrun simctl terminate "$SIMULATOR_ID" "$bundle_id"
          xcrun simctl launch --terminate-running-process "$SIMULATOR_ID" "$bundle_id" -openSettings
          sleep 3
          xcrun simctl io "$SIMULATOR_ID" screenshot "$settings_shot"
          test -s "$settings_shot"
          xcrun simctl terminate "$SIMULATOR_ID" "$bundle_id"
          xcrun simctl launch --terminate-running-process "$SIMULATOR_ID" "$bundle_id" -openSettings -openAlerts
          sleep 3
          xcrun simctl io "$SIMULATOR_ID" screenshot "$RUNNER_TEMP/codecaps-ios-alert-settings.png"
          xcrun simctl terminate "$SIMULATOR_ID" "$bundle_id"
          xcrun simctl launch --terminate-running-process "$SIMULATOR_ID" "$bundle_id" -openSettings -openAlerts -showAlertCategories -previewAlertOptions
          sleep 3
          xcrun simctl io "$SIMULATOR_ID" screenshot "$RUNNER_TEMP/codecaps-ios-alert-categories.png"
          xcrun simctl terminate "$SIMULATOR_ID" "$bundle_id"
          python3 - "$app_data/Library/Application Support/CodeCaps/quota-windows.json" <<'PYEMPTY'
          import json, sys
          with open(sys.argv[1], "w", encoding="utf-8") as snapshot:
              json.dump({"windows": []}, snapshot)
          PYEMPTY
          xcrun simctl launch "$SIMULATOR_ID" "$bundle_id"
          sleep 3
          xcrun simctl io "$SIMULATOR_ID" screenshot "$RUNNER_TEMP/codecaps-ios-empty.png"
      - name: Build Mac widget extension (no signing)
        run: |
          cd ios/CodeCapsCompanion
          xcodebuild -project CodeCapsCompanion.xcodeproj \
            -target CodeCapsWidgetsMac -configuration Release \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build
      - name: Upload iOS platform-reordering screenshot
        uses: actions/upload-artifact@v7
        with:
          name: codecaps-ios-platform-reordering
          path: |
            ${{ runner.temp }}/codecaps-ios-reorder.png
            ${{ runner.temp }}/codecaps-ios-empty.png
            ${{ runner.temp }}/codecaps-ios-settings.png
            ${{ runner.temp }}/codecaps-ios-alert-settings.png
            ${{ runner.temp }}/codecaps-ios-alert-categories.png
          if-no-files-found: error
