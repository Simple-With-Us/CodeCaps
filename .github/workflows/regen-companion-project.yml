name: Regenerate companion project
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  regen:
    runs-on: macos-latest
    env:
      XCODEGEN_VERSION: "2.46.0"
      XCODEGEN_SHA256: "4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Install pinned XcodeGen
        run: |
          archive="$RUNNER_TEMP/xcodegen-${XCODEGEN_VERSION}.zip"
          curl -fsSL --retry 3 -o "$archive" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          echo "${XCODEGEN_SHA256}  ${archive}" | shasum -a 256 -c -
          unzip -q "$archive" -d "$RUNNER_TEMP/xcodegen-dist"
          echo "$RUNNER_TEMP/xcodegen-dist/xcodegen/bin" >> "$GITHUB_PATH"
      - name: Regenerate and commit
        run: |
          cd ios/CodeCapsCompanion
          xcodegen generate
          cd ../..
          if ! git diff --quiet -- ios/CodeCapsCompanion; then
            git config user.name "zcode-regen-bot"
            git config user.email "zc-bot@simplewithus.zulipchat.com"
            git add ios/CodeCapsCompanion
            git commit -m "chore: regenerate companion project with XcodeGen 2.46.0"
            git push origin HEAD
          else
            echo "No project changes; nothing to commit."
          fi
