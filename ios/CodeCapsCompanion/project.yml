name: CodeCapsCompanion

options:
  bundleIdPrefix: com.simplewithus
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: CC8UTF7ATG
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: targeted

targets:
  CodeCapsCompanion:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - "InfoMac.plist"
          - "CodeCapsCompanionMac.entitlements"
      - path: Assets.xcassets
    dependencies:
      - target: CodeCapsWidgets
        embed: true
    settings:
      base:
        INFOPLIST_FILE: App/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.simplewithus.codecaps.ios
        DEVELOPMENT_TEAM: CC8UTF7ATG
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: App/CodeCapsCompanion.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        ITSAppUsesNonExemptEncryption: false

  CodeCapsWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
        excludes:
          - "InfoMac.plist"
          - "CodeCapsWidgetsMac.entitlements"
      - path: Assets.xcassets
    settings:
      base:
        INFOPLIST_FILE: Widgets/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.simplewithus.codecaps.ios.widgets
        DEVELOPMENT_TEAM: CC8UTF7ATG
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Widgets/CodeCapsWidgets.entitlements
        GENERATE_INFOPLIST_FILE: NO
        ITSAppUsesNonExemptEncryption: false

  CodeCapsCompanionMac:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: App
        excludes:
          - "Info.plist"
          - "CodeCapsCompanion.entitlements"
      - path: Assets.xcassets
    dependencies:
      - target: CodeCapsWidgetsMac
        embed: true
    settings:
      base:
        INFOPLIST_FILE: App/InfoMac.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.simplewithus.codecaps.macos
        PRODUCT_NAME: CodeCaps
        DEVELOPMENT_TEAM: CC8UTF7ATG
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: App/CodeCapsCompanionMac.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        ITSAppUsesNonExemptEncryption: false

  CodeCapsWidgetsMac:
    type: app-extension
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Widgets
        excludes:
          - "Info.plist"
          - "CodeCapsWidgets.entitlements"
      - path: Assets.xcassets
    settings:
      base:
        INFOPLIST_FILE: Widgets/InfoMac.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.simplewithus.codecaps.macos.widgets
        PRODUCT_NAME: CodeCapsWidgets
        DEVELOPMENT_TEAM: CC8UTF7ATG
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Widgets/CodeCapsWidgetsMac.entitlements
        GENERATE_INFOPLIST_FILE: NO
        ITSAppUsesNonExemptEncryption: false

schemes:
  CodeCapsCompanion:
    build:
      targets:
        CodeCapsCompanion: all
        CodeCapsWidgets: all
    run:
      config: Debug
    profile:
      config: Release
    archive:
      config: Release

  CodeCapsCompanionMac:
    build:
      targets:
        CodeCapsCompanionMac: all
        CodeCapsWidgetsMac: all
    run:
      config: Debug
    profile:
      config: Release
    archive:
      config: Release
