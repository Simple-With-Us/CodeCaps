name: CodeCapsCompanion

options:
  bundleIdPrefix: com.simplewithus
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: CC8UTF7ATG
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: targeted

targets:
  CodeCapsCompanion:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - "InfoMac.plist"
          - "CodeCapsCompanionMac.entitlements"
          - "CodeCapsCompanionMac.Release.entitlements"
          - "CodeCapsCompanion.Release.entitlements"
      - path: Assets.xcassets
      # The reset alarm's rules and wording are shared with the Mac app, so the
      # two cannot drift apart.  Plain Foundation; no other QuotaCore type.
      - path: ../../Sources/QuotaCore/ResetAlarmTracker.swift
        group: Shared
      - path: ../../Sources/QuotaCore/ResetAlarmMessage.swift
        group: Shared
      - path: ../../Sources/QuotaCore/ResetAlarmCadence.swift
        group: Shared
    dependencies:
      - target: CodeCapsWidgets
        embed: true
    settings:
      base:
        INFOPLIST_FILE: App/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.simplewithus.codecaps.ios
        DEVELOPMENT_TEAM: CC8UTF7ATG
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: App/CodeCapsCompanion.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        ITSAppUsesNonExemptEncryption: false
      # Release builds need the same app-group capability as Debug so the
      # companion app and WidgetKit extension can share pulled quota data.
      # Provisioning profiles must authorize this group for this bundle ID.
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "CodeCaps Companion AppStore"
          CODE_SIGN_ENTITLEMENTS: App/CodeCapsCompanion.entitlements

  CodeCapsWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
        excludes:
          - "InfoMac.plist"
          - "CodeCapsWidgetsMac.entitlements"
          - "CodeCapsWidgetsMac.Release.entitlements"
          - "CodeCapsWidgets.Release.entitlements"
      - path: Assets.xcassets
      - path: ../../Sources/QuotaCore/WidgetSnapshotFetcher.swift
        group: Shared
    settings:
      base:
        INFOPLIST_FILE: Widgets/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.simplewithus.codecaps.ios.widgets
        DEVELOPMENT_TEAM: CC8UTF7ATG
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Widgets/CodeCapsWidgets.entitlements
        GENERATE_INFOPLIST_FILE: NO
        ITSAppUsesNonExemptEncryption: false
      # Release profiles must authorize the app group for this extension ID.
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "CodeCaps Companion Widgets AppStore"
          CODE_SIGN_ENTITLEMENTS: Widgets/CodeCapsWidgets.entitlements

  CodeCapsCompanionMac:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: App
        excludes:
          - "Info.plist"
          - "CodeCapsCompanion.entitlements"
          - "CodeCapsCompanion.Release.entitlements"
          - "CodeCapsCompanionMac.entitlements"
          - "CodeCapsCompanionMac.Release.entitlements"
      - path: Assets.xcassets
      - path: ../../Sources/QuotaCore/ResetAlarmTracker.swift
        group: Shared
      - path: ../../Sources/QuotaCore/ResetAlarmMessage.swift
        group: Shared
      - path: ../../Sources/QuotaCore/ResetAlarmCadence.swift
        group: Shared
    dependencies:
      - target: CodeCapsWidgetsMac
        embed: true
    entitlements:
      path: Generated/CodeCapsCompanionMac.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.application-groups:
          - CC8UTF7ATG.codecaps
    settings:
      base:
        INFOPLIST_FILE: App/InfoMac.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.simplewithus.codecaps.macos
        PRODUCT_NAME: CodeCaps
        DEVELOPMENT_TEAM: CC8UTF7ATG
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        ITSAppUsesNonExemptEncryption: false
      # Release profiles must authorize the app group for this app ID.
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "CodeCaps for Mac AppStore"

  CodeCapsWidgetsMac:
    type: app-extension
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Widgets
        excludes:
          - "Info.plist"
          - "CodeCapsWidgets.entitlements"
          - "CodeCapsWidgets.Release.entitlements"
          - "CodeCapsWidgetsMac.entitlements"
          - "CodeCapsWidgetsMac.Release.entitlements"
      - path: Assets.xcassets
      - path: ../../Sources/QuotaCore/WidgetSnapshotFetcher.swift
        group: Shared
    entitlements:
      path: Generated/CodeCapsWidgetsMac.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups:
          - CC8UTF7ATG.codecaps
    settings:
      base:
        INFOPLIST_FILE: Widgets/InfoMac.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.simplewithus.codecaps.macos.widgets
        PRODUCT_NAME: CodeCapsWidgets
        DEVELOPMENT_TEAM: CC8UTF7ATG
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        ITSAppUsesNonExemptEncryption: false
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "CodeCaps Mac Widgets AppStore"

schemes:
  CodeCapsCompanion:
    build:
      targets:
        CodeCapsCompanion: all
        CodeCapsWidgets: all
    run:
      config: Debug
    profile:
      config: Release
    archive:
      config: Release

  CodeCapsCompanionMac:
    build:
      targets:
        CodeCapsCompanionMac: all
        CodeCapsWidgetsMac: all
    run:
      config: Debug
    profile:
      config: Release
    archive:
      config: Release
